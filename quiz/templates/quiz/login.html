{% extends "quiz/base.html" %}
{% block title %}Kirish{% endblock %}

{% block content %}
    <div class="card p-4 mx-auto mt-4" style="max-width: 400px;">
        <h3 class="mb-3 text-center">Kirish</h3>

        {% if form.errors %}
            <div class="alert alert-danger">Login yoki parol noto'g'ri.</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Login</label>
                <input type="text" name="username" class="form-control bg-dark text-white border-secondary" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Parol</label>
                <input type="password" name="password" class="form-control bg-dark text-white border-secondary" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Kirish</button>
        </form>

        <p class="mt-3 text-center">
            Hisobingiz yo'qmi? <a href="{% url 'quiz:register' %}" class="text-info">Ro'yxatdan o'ting</a>
        </p>
    </div>
{% endblock %}
