{% extends "quiz/base.html" %}
{% block title %}Ro'yxatdan o'tish{% endblock %}

{% block content %}
    <div class="card p-4 mx-auto mt-4" style="max-width: 400px;">
        <h3 class="mb-3 text-center">Ro'yxatdan o'tish</h3>

        {% if form.errors %}
            <div class="alert alert-danger">{{ form.errors }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Login</label>
                <input type="text" name="username" class="form-control bg-dark text-white border-secondary" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control bg-dark text-white border-secondary" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Parol</label>
                <input type="password" name="password1" class="form-control bg-dark text-white border-secondary" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Parolni tasdiqlang</label>
                <input type="password" name="password2" class="form-control bg-dark text-white border-secondary" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Ro'yxatdan o'tish</button>
        </form>

        <p class="mt-3 text-center">
            Hisobingiz bormi? <a href="{% url 'quiz:login' %}" class="text-info">Kiring</a>
        </p>
    </div>
{% endblock %}
