<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Django Quiz{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body {
            background-color: #0a0e14;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(88, 166, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 10%, rgba(126, 87, 255, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
            color: #e6edf3;
            min-height: 100vh;
        }
        .navbar {
            background-color: rgba(10, 14, 20, 0.7) !important;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #30363d;
        }
        .navbar-brand { font-weight: 700; font-size: 1.3rem; }
        .navbar-brand i { color: #58a6ff; }

        .card {
            background: #11161d;
            border: 1px solid #30363d;
            border-radius: 14px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #238636 0%, #2ea043 100%);
            border: none;
            font-weight: 600;
            border-radius: 10px;
            padding: 12px 32px;
            font-size: 1.05rem;
            box-shadow: 0 4px 20px rgba(46, 160, 67, 0.25);
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(46, 160, 67, 0.4);
        }
        .btn-outline-light { border-radius: 8px; }

        label, p, h1, h2, h3, h4, h5 { color: #e6edf3; }
        .text-secondary { color: #8b949e !important; }

        .form-check {
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .form-check:hover {
            border-color: #58a6ff;
            transform: translateX(3px);
        }
        .form-check-input {
            cursor: pointer;
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            margin: 0;
        }
        .form-check-label {
            color: #e6edf3 !important;
            cursor: pointer;
        }
        .form-check-input:checked + .form-check-label {
            color: #58a6ff !important;
            font-weight: 600;
        }
        .form-check:has(.form-check-input:checked) {
            border-color: #58a6ff;
            background: linear-gradient(90deg, rgba(88,166,255,0.12), transparent);
        }
        .card label.fw-bold {
            color: #ffffff !important;
            font-size: 1.15rem;
            font-weight: 600 !important;
        }

        .badge-easy, .badge-medium, .badge-hard {
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
        }
        .badge-easy { background: linear-gradient(135deg, #238636, #2ea043); }
        .badge-medium { background: linear-gradient(135deg, #9e6a03, #d29922); }
        .badge-hard { background: linear-gradient(135deg, #da3633, #f85149); }

        .leaderboard-row:nth-child(1) .rank { color: #ffd700; font-weight: 700; font-size: 1.15rem; }
        .leaderboard-row:nth-child(2) .rank { color: #c0c0c0; font-weight: 700; }
        .leaderboard-row:nth-child(3) .rank { color: #cd7f32; font-weight: 700; }
        .leaderboard-row:hover { background-color: #161b22; }

        .hero-wrap {
            text-align: center;
            padding: 70px 0 50px;
        }
        .hero-badge {
            display: inline-block;
            background: rgba(88, 166, 255, 0.1);
            border: 1px solid rgba(88, 166, 255, 0.3);
            color: #79c0ff;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 18px;
            border-radius: 999px;
            margin-bottom: 20px;
        }
        .hero-title {
            font-size: 3.2rem;
            font-weight: 800;
            line-height: 1.2;
            background: linear-gradient(135deg, #ffffff 30%, #79c0ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-sub {
            font-size: 1.15rem;
            color: #8b949e;
            max-width: 620px;
            margin: 20px auto 0;
        }

        .stat-card {
            background: linear-gradient(160deg, #11161d, #161b22);
            border: 1px solid #30363d;
            border-radius: 18px;
            padding: 32px 20px;
            text-align: center;
            transition: all 0.25s ease;
        }
        .stat-card:hover {
            transform: translateY(-6px);
            border-color: #58a6ff60;
            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
        }
        .stat-icon-circle {
            width: 64px; height: 64px;
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 18px;
            font-size: 1.8rem;
        }
        .stat-icon-circle.blue { background: rgba(88,166,255,0.12); color: #58a6ff; }
        .stat-icon-circle.purple { background: rgba(167,139,250,0.12); color: #a78bfa; }
        .stat-icon-circle.green { background: rgba(63,185,80,0.12); color: #3fb950; }
        .stat-number { font-size: 2.5rem; font-weight: 800; color: #fff; margin-bottom: 4px; }
        .stat-label { color: #8b949e; font-size: 0.95rem; }

        a { text-decoration: none; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'quiz:home' %}">
            <i class="bi bi-patch-question-fill"></i> Django Quiz
        </a>
        <div class="d-flex gap-3 align-items-center">
            <a href="{% url 'quiz:category_list' %}" class="text-white">Kategoriyalar</a>
            <a href="{% url 'quiz:leaderboard' %}" class="text-white">Reyting</a>
            {% if user.is_authenticated %}
                <span class="text-secondary">|</span>
                <span class="text-white"><i class="bi bi-person-circle"></i> {{ user.username }}</span>
                <form method="post" action="{% url 'quiz:logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">Chiqish</button>
                </form>
            {% else %}
                <a href="{% url 'quiz:login' %}" class="btn btn-outline-light btn-sm">Kirish</a>
                <a href="{% url 'quiz:register' %}" class="btn btn-primary btn-sm">Ro'yxatdan o'tish</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container py-4">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-info">{{ message }}</div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
